version: "2.4"

services:
  odoo:
    extends:
      file: common.yaml
      service: odoo
    restart: unless-stopped
    env_file:
      - .docker/odoo.env
      - .docker/db-access.env
    environment:
      DB_FILTER: ""
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-prod}"
      INITIAL_LANG: "en_US"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      PGHOST: odoo-doodba-18-0-prod-db
    depends_on:
      - db
    networks:
      default:
    labels:
      doodba.domain.main: ""

  db:
    extends:
      file: common.yaml
      service: db
    environment:
      - DB_HOST=odoo-doodba-18-0-prod-db
    env_file:
      - .docker/db-creation.env
    restart: unless-stopped
    ports:
      - "5432:5432"

networks:
  default:
    driver_opts:
      encrypted: 1

  inverseproxy_shared:
    external: true

volumes:
  filestore:
  db:
